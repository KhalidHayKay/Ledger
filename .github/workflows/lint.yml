name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      - name: Download deps
        run: go mod download

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout 5m
