name: Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      - name: Build Docker image (immutable)
        run: |
          docker build \
            --build-arg APP_ENV=production \
            -t ledger-app:${{ github.sha }} .

      - name: Save image metadata
        run: echo "Built image ledger-app:${{ github.sha }}"
